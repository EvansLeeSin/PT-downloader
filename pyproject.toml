[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mteam-downloader"
version = "0.1.0"
description = "API-first M-Team search and qBittorrent download console"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.143.2",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "cryptography==50.0.2",
  "qbittorrent-api==2026.10.0",
  "tldextract==5.4.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "respx==0.23.1", "ruff==0.17.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
